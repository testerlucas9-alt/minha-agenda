<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Sistema</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 20px;
      text-align: center;
    }

    nav {
      background: #1e293b;
      padding: 10px;
      text-align: center;
    }

    nav button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .pagina {
      display: none;
    }

    .pagina.ativa {
      display: block;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    input, select {
      padding: 10px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .botao {
      background: #2563eb;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .excluir {
      background: #dc2626;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #e2e8f0;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .numero {
      font-size: 30px;
      font-weight: bold;
      color: #2563eb;
    }
  </style>
</head>

<body>

<header>
  <h1>🚀 Meu Sistema</h1>
  <p>Primeiro sistema web</p>
</header>

<nav>
  <button onclick="abrirPagina('inicio')">Dashboard</button>
  <button onclick="abrirPagina('tarefas')">Tarefas</button>
  <button onclick="abrirPagina('clientes')">Clientes</button>
</nav>

<main>

  <!-- DASHBOARD -->

  <section id="inicio" class="pagina ativa">

    <h2>Dashboard</h2>

    <div class="dashboard">

      <div class="card">
        <p>Tarefas cadastradas</p>
        <div id="totalTarefas" class="numero">0</div>
      </div>

      <div class="card">
        <p>Clientes cadastrados</p>
        <div id="totalClientes" class="numero">0</div>
      </div>

      <div class="card">
        <p>Status</p>
        <div class="numero">Online</div>
      </div>

    </div>

  </section>


  <!-- TAREFAS -->

  <section id="tarefas" class="pagina">

    <div class="card">

      <h2>Nova tarefa</h2>

      <input
        type="text"
        id="nomeTarefa"
        placeholder="Digite uma tarefa"
      >

      <button class="botao" onclick="adicionarTarefa()">
        Adicionar
      </button>

    </div>

    <div class="card">

      <h2>Lista de tarefas</h2>

      <div id="listaTarefas"></div>

    </div>

  </section>


  <!-- CLIENTES -->

  <section id="clientes" class="pagina">

    <div class="card">

      <h2>Novo cliente</h2>

      <input
        type="text"
        id="nomeCliente"
        placeholder="Nome"
      >

      <input
        type="text"
        id="telefoneCliente"
        placeholder="Telefone"
      >

      <input
        type="email"
        id="emailCliente"
        placeholder="E-mail"
      >

      <button class="botao" onclick="adicionarCliente()">
        Cadastrar
      </button>

    </div>

    <div class="card">

      <h2>Clientes cadastrados</h2>

      <table>

        <thead>
          <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>E-mail</th>
            <th>Ação</th>
          </tr>
        </thead>

        <tbody id="tabelaClientes"></tbody>

      </table>

    </div>

  </section>

</main>


<script>

  let tarefas = JSON.parse(localStorage.getItem("tarefas")) || [];

  let clientes = JSON.parse(localStorage.getItem("clientes")) || [];


  function abrirPagina(nome) {

    const paginas = document.querySelectorAll(".pagina");

    paginas.forEach(function(pagina) {
      pagina.classList.remove("ativa");
    });

    document
      .getElementById(nome)
      .classList.add("ativa");
  }


  function salvarDados() {

    localStorage.setItem(
      "tarefas",
      JSON.stringify(tarefas)
    );

    localStorage.setItem(
      "clientes",
      JSON.stringify(clientes)
    );

    atualizarDashboard();
  }


  function adicionarTarefa() {

    const campo =
      document.getElementById("nomeTarefa");

    const nome = campo.value.trim();

    if (nome === "") {
      alert("Digite uma tarefa.");
      return;
    }

    tarefas.push({
      id: Date.now(),
      nome: nome
    });

    campo.value = "";

    salvarDados();

    mostrarTarefas();
  }


  function excluirTarefa(id) {

    tarefas = tarefas.filter(function(tarefa) {
      return tarefa.id !== id;
    });

    salvarDados();

    mostrarTarefas();
  }


  function mostrarTarefas() {

    const lista =
      document.getElementById("listaTarefas");

    lista.innerHTML = "";

    tarefas.forEach(function(tarefa) {

      const div =
        document.createElement("div");

      div.className = "card";

      div.innerHTML =
        "<strong>" +
        tarefa.nome +
        "</strong>" +
        "<br><br>" +
        '<button class="botao excluir" onclick="excluirTarefa(' +
        tarefa.id +
        ')">Excluir</button>';

      lista.appendChild(div);
    });
  }


  function adicionarCliente() {

    const nome =
      document.getElementById("nomeCliente").value.trim();

    const telefone =
      document.getElementById("telefoneCliente").value.trim();

    const email =
      document.getElementById("emailCliente").value.trim();

    if (nome === "") {
      alert("Digite o nome do cliente.");
      return;
    }

    clientes.push({
      id: Date.now(),
      nome: nome,
      telefone: telefone,
      email: email
    });

    document.getElementById("nomeCliente").value = "";
    document.getElementById("telefoneCliente").value = "";
    document.getElementById("emailCliente").value = "";

    salvarDados();

    mostrarClientes();
  }


  function excluirCliente(id) {

    clientes = clientes.filter(function(cliente) {
      return cliente.id !== id;
    });

    salvarDados();

    mostrarClientes();
  }


  function mostrarClientes() {

    const tabela =
      document.getElementById("tabelaClientes");

    tabela.innerHTML = "";

    clientes.forEach(function(cliente) {

      const linha =
        document.createElement("tr");

      linha.innerHTML =
        "<td>" + cliente.nome + "</td>" +
        "<td>" + cliente.telefone + "</td>" +
        "<td>" + cliente.email + "</td>" +
        '<td><button class="botao excluir" onclick="excluirCliente(' +
        cliente.id +
        ')">Excluir</button></td>';

      tabela.appendChild(linha);
    });
  }


  function atualizarDashboard() {

    document.getElementById("totalTarefas").innerText =
      tarefas.length;

    document.getElementById("totalClientes").innerText =
      clientes.length;
  }


  mostrarTarefas();

  mostrarClientes();

  atualizarDashboard();

</script>

</body>
</html>
