<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Agenda</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        input {
            width: 70%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        li {
            margin-top: 15px;
            padding: 12px;
            background: #f1f1f1;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>📅 Minha Agenda</h1>

        <p>Digite um compromisso:</p>

        <input
            type="text"
            id="compromisso"
            placeholder="Ex: Reunião às 14h"
        >

        <button onclick="adicionar()">
            Adicionar
        </button>

        <ul id="lista"></ul>

    </div>

    <script>
        function adicionar() {

            const campo = document.getElementById("compromisso");
            const lista = document.getElementById("lista");

            if (campo.value === "") {
                alert("Digite um compromisso!");
                return;
            }

            const item = document.createElement("li");

            item.textContent = campo.value;

            lista.appendChild(item);

            campo.value = "";
        }
    </script>

</body>

</html>
